name: Run maven tests

on:
  push:
    branches: [main]

  workflow_call:

  repository_dispatch:
    types: [build-publish-image]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  call-workflow-maven-build:
    uses: felleslosninger/github-workflows/.github/workflows/ci-pr-checks-lib.yml@main
    # ci-pr-checks-lib.yml declares a (Dependabot) auto-merge job requiring these permissions.
    # GitHub validates them at startup even though auto-merge is disabled here, so they must be granted.
    permissions:
      contents: write
      pull-requests: write
    with:
      java-version: 21
    secrets: inherit
